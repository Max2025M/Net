<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extrator WhatsApp Inteligente</title>
<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #007bff, #00bcd4);
  color: #333;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  background: #fff;
  padding: 25px 30px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
  width: 90%;
  max-width: 550px;
  text-align: center;
}
h1 {
  color: #007bff;
  margin-bottom: 10px;
}
p {
  color: #666;
  font-size: 14px;
}
input[type=file] {
  display: block;
  width: 100%;
  margin-top: 15px;
}
button {
  margin-top: 15px;
  background: #007bff;
  border: none;
  color: white;
  padding: 10px 16px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
}
button:hover {
  background: #0056b3;
}
textarea {
  width: 100%;
  margin-top: 15px;
  height: 100px;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 8px;
}
#popup {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 18px;
  font-weight: bold;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 1000;
}
#popup span {
  margin-top: 10px;
}
.spinner {
  display: inline-block;
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255, 255, 255, 0.3);
  border-left-color: #00e5ff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
#error {
  color: red;
  margin-top: 10px;
  font-weight: bold;
  display: none;
}
</style>
</head>
<body>
  <div class="container">
    <h1>📸 Extrator de Números WhatsApp</h1>
    <p>Envie múltiplas imagens e o sistema extrairá números moçambicanos válidos.</p>
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="images" accept="image/*" multiple required />
      <button type="submit">Enviar e Extrair</button>
    </form>

    <div id="error"></div>

    <div id="result" style="display:none;">
      <h3>Números encontrados:</h3>
      <textarea id="numbers" readonly></textarea>
      <button id="copyBtn">📋 Copiar</button>
    </div>
  </div>

  <div id="popup">
    <div class="spinner"></div>
    <span id="progressText">Extraindo imagem 1 de N</span>
  </div>

  <script>
  const form = document.getElementById('uploadForm');
  const popup = document.getElementById('popup');
  const progressText = document.getElementById('progressText');
  const resultDiv = document.getElementById('result');
  const errorDiv = document.getElementById('error');
  const numbersField = document.getElementById('numbers');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    popup.style.display = 'flex';
    errorDiv.style.display = 'none';
    resultDiv.style.display = 'none';
    numbersField.value = "";

    const data = new FormData(form);
    const files = form.querySelector('input[type=file]').files;
    const totalImages = files.length;

    progressText.textContent = `Extraindo imagem 1 de ${totalImages}...`;

    try {
      const res = await fetch('/upload', { method: 'POST', body: data });
      const json = await res.json();

      if (json.error) {
        popup.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.textContent = json.error;
        return;
      }

      // Atualizar progresso dinamicamente conforme servidor processa
      for (let i = 0; i < json.progress.length; i++) {
        const p = json.progress[i];
        progressText.textContent = `Extraindo imagem ${p.imageIndex} de ${p.total} (${p.found} encontrados)`;
        await new Promise(r => setTimeout(r, 500)); // simulação de tempo
      }

      popup.style.display = 'none';
      numbersField.value = json.numbers.join(", ") || 'Nenhum número encontrado.';
      resultDiv.style.display = 'block';
    } catch (err) {
      popup.style.display = 'none';
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Erro ao conectar ao servidor.';
    }
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(numbersField.value);
      alert('📋 Copiado!');
    } catch {
      alert('Falha ao copiar!');
    }
  });
  </script>
</body>
</html>
